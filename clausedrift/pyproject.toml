[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausedrift"
version = "0.1.0"
description = "Explainable drift detection for AI-generated text. Compares two versions and classifies every change."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdur Rahim" }]
keywords = ["llm", "evaluation", "diff", "regression-testing", "nlp", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.scripts]
clausedrift = "clausedrift.cli:main"

[project.urls]
Homepage = "https://github.com/AbdRahim001/clausedrift"
Issues = "https://github.com/AbdRahim001/clausedrift/issues"

[tool.setuptools.packages.find]
include = ["clausedrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
